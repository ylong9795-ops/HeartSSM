# Existing immutable dataset/template; no synthetic data generation.
data_config: configs/synthetic_data.yaml
encoder:
  shape_dim: 64
  motion_dim: 32
  width: 128
  heads: 4
  temporal_layers: 2
  spatial_sides: [14, 7]
  query_slots: 8
  sdf_scale_mm: 15.0
  cnn_chunk_size: 6
  checkpoint_cnn: true
decoder:
  frames: 24
  channels: 32
  seed_shape: [6, 6, 8]
  lower_mm: [-120.0, -110.0, -110.0]
  upper_mm: [120.0, 110.0, 110.0]
  regional_shape: true
  global_shape_dim: 32
  regional_grid_shape: [4, 4, 4]
slice:
  target_mode: paired_soft_geometry_v1
  sigma_mm: 1.0
  pixel_stride: 4
  chunk_size: 256
  dice_weight: 1.0
  bce_weight: 0.1
  boundary_weight: 0.1
loss:
  huber_beta_mm: 1.0
  weights:
    shape: 1.0
    motion: 1.0
    velocity: 0.2
    volume: 0.01
    edge: 0.05
    laplacian: 0.05
    normal: 0.01
    control: 0.001
    slice: 0.5
training:
  device: cuda:0
  seed: 2026
  epochs: 100
  shape_epochs: 5
  motion_epochs: 10
  batch_size: 1
  learning_rate: 0.0001
  workers: 0
  cpu_threads: 4
  validation_cases: 8
  checkpoint_every_steps: 100
  output: outputs/neural_ffd
