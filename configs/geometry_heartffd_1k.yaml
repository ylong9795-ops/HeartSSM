# Independent architecture, random initialization, immutable 800/100/100 split.
# Default command requires --acceptance, --evaluate or explicit --train.
data_config: configs/synthetic_data_1k.yaml
pose_mode: known_pose
encoder:
  width: 128
  spatial_sides: [14, 7]
  sdf_scale_mm: 15.0
  cnn_chunk_size: 6
  checkpoint_cnn: true
lifting:
  projected_width: 4
  sigma_mm: 8.0
  cutoff_sigma: 3.0
decoder:
  frames: 24
  channels: 32
  lower_mm: [-120.0, -110.0, -110.0]
  upper_mm: [120.0, 110.0, 110.0]
  reference_limit_mm: 12.0
  increment_limit_mm: 2.0
  max_lipschitz: 0.45
slice:
  target_mode: binary_native_v1
  sigma_mm: 1.0
  pixel_stride: 4
  chunk_size: 256
  dice_weight: 1.0
  bce_weight: 0.1
  boundary_weight: 0.1
loss:
  huber_beta_mm: 1.0
  weights:
    shape: 1.0
    motion: 1.0
    velocity: 0.2
    volume: 0.01
    edge: 0.05
    laplacian: 0.05
    normal: 0.01
    control: 0.001
    slice: 0.5
training:
  device: cuda:0
  seed: 2026
  epochs: 200
  shape_epochs: 10
  motion_epochs: 20
  batch_size: 1
  learning_rate: 0.0001
  workers: 0
  cpu_threads: 4
  validation_cases: 4
  checkpoint_every_steps: 20
  output: outputs/geometry_heartffd_1k
acceptance:
  cases: 4
  shape_updates: 32
  motion_updates: 96
  joint_updates: 16
  learning_rate: 0.001
  evaluation_every_updates: 32
