data_config: configs/synthetic_data_1k.yaml
encoder:
  feature_transfer: direct_residual_v1
  direct_pool_side: 2
  direct_frame_gain: 1.0
  direct_shape_gain: 1.0
  shape_dim: 64
  motion_dim: 32
  width: 128
  heads: 4
  temporal_layers: 2
  spatial_sides:
  - 14
  - 7
  query_slots: 8
  sdf_scale_mm: 15.0
  cnn_chunk_size: 6
  checkpoint_cnn: true
  known_pose: true
  geometry_scale_mm: 100.0
decoder:
  frames: 24
  channels: 32
  seed_shape:
  - 6
  - 6
  - 8
  lower_mm:
  - -120.0
  - -110.0
  - -110.0
  upper_mm:
  - 120.0
  - 110.0
  - 110.0
  regional_shape: true
  global_shape_dim: 32
  regional_grid_shape:
  - 4
  - 4
  - 4
slice:
  target_mode: paired_soft_geometry_v1
  sigma_mm: 1.0
  pixel_stride: 4
  chunk_size: 256
  dice_weight: 1.0
  bce_weight: 0.1
  boundary_weight: 0.1
loss:
  huber_beta_mm: 1.0
  weights:
    shape: 1.0
    motion: 1.0
    velocity: 0.2
    volume: 0.01
    edge: 0.05
    laplacian: 0.05
    normal: 0.01
    control: 0.001
    slice: 0.5
training:
  device: cuda:0
  seed: 2026
  epochs: 5
  shape_epochs: 0
  motion_epochs: 0
  batch_size: 1
  learning_rate: 1.0e-05
  workers: 4
  cpu_threads: 4
  validation_cases: 100
  checkpoint_every_steps: 100
  output: outputs/known_pose_regional_v1/pose
  joint_min_learning_rate: 1.0e-05
  save_best: true
